<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#5f4bdb"><title>Швейный цех</title><link rel="stylesheet" href="/style.css"></head>
<body>
  <div id="toast"></div>
  <main id="login" class="screen login-screen">
    <section class="login-card"><div class="logo">🧵</div><h1>Швейный цех</h1><p>Учёт выполненной работы</p>
      <label>Логин<input id="loginInput" autocomplete="username" placeholder="Введите логин"></label>
      <label>PIN-код<input id="pinInput" type="password" inputmode="numeric" autocomplete="current-password" maxlength="12" placeholder="••••"></label>
      <button id="loginBtn" class="primary">Войти</button><div id="loginError" class="error"></div>
    </section>
  </main>
  <main id="app" class="screen hidden">
    <header><div><small>Швейный цех</small><h2 id="userName"></h2></div><button id="logoutBtn" class="icon-btn">Выйти</button></header>
    <nav id="nav"></nav><section id="content"></section>
  </main>
  <script src="/app.js"></script>
</body></html>
